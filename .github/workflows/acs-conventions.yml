# acs convention check — installed by /acs:setup into the consumer repo at
# .github/workflows/acs-conventions.yml. Re-run /acs:setup to refresh it.
#
# Checks one thing: the PR description names its ticket — the acs id (ACS-12),
# a #<issue> reference, or an issue link (ADR-0106). The `acs-exempt` label or an
# exempt branch (release/*, dependabot/*, renovate/*) skips it. Make it a
# REQUIRED status check on your default branch so a PR with no ticket cannot
# merge: /acs:setup offers to configure that, or run it once as a repo admin:
#   gh api -X PUT repos/{owner}/{repo}/branches/{branch}/protection ...
name: ACS conventions

on:
  pull_request:
    # `edited` re-checks when the body changes; `labeled`/`unlabeled` re-evaluate
    # the exempt label; `synchronize` reports the check on each new head commit.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

# Do NOT cancel in-progress runs. A cancelled run leaves a non-SUCCESS conclusion on the
# required check for the head SHA, and branch protection treats that as unmet.
concurrency:
  group: acs-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  conventions:
    # The context name branch protection requires. It is kept as-is so a repo
    # that already requires it is not left waiting on a check that never reports.
    name: Branch / PR / commit conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check the PR names its ticket
        # Payload reaches the script via env (never interpolated into the shell),
        # so a crafted PR body cannot inject commands.
        env:
          ACS_PR_BODY: ${{ github.event.pull_request.body }}
          ACS_PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          ACS_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 .acs/ci/check-conventions.py --mode pr
