name: Release

# Single automated release for the gms-marketplace catalog and its acs plugin,
# which share ONE version. To ship a release:
#   1. Bump "version" in BOTH .claude-plugin/marketplace.json AND
#      plugins/acs/.claude-plugin/plugin.json to the SAME value (CI enforces
#      they match), following semver: MAJOR for breaking changes to
#      skills/hooks/state contracts, MINOR for new backwards-compatible
#      capability, PATCH for backwards-compatible fixes.
#   2. Nothing to repoint in marketplace.json: the acs entry's source is the
#      relative path "./plugins/acs", so an install resolves it inside the
#      marketplace ref it was installed at. The Devin meta-plugin still pins a
#      tag, so set the acs entry's "ref" in .devin-plugin/plugin.json
#      requiredPlugins to "v<version>". The tag is created by this same push,
#      so that ref resolves once this workflow runs.
#   3. Add a matching "## [<version>] - YYYY-MM-DD" section to
#      plugins/acs/CHANGELOG.md (move entries out of [Unreleased]).
#   4. Merge to main. This workflow reads the marketplace version, and if the
#      GitHub release v<version> does not exist yet, creates the annotated tag
#      (unless it already exists) and the release, whose notes are that
#      changelog section (cut short, with a link to the full section, past
#      GitHub's 125,000-character body limit). If the release exists, it skips
#      gracefully. A run that tagged but failed to publish is finished by
#      re-running it (workflow_dispatch). Consumers pin with @v<version>.

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/marketplace.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so all existing tags are visible

      - name: Read version
        id: version
        run: |
          MANIFEST=".claude-plugin/marketplace.json"
          VERSION="$(python3 -c "import json; print(json.load(open('${MANIFEST}'))['version'])")"
          # Prefer the human-readable displayName for the release title; fall
          # back to name if displayName is absent.
          TITLE="$(python3 -c "import json; m=json.load(open('${MANIFEST}')); print(m.get('displayName') or m['name'])")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"
          echo "Release title: ${TITLE}"

      - name: Check whether the tag and the release exist
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          # A tag without its release is a half-finished run (v0.5.0's notes
          # were over GitHub's body limit): publish the release, keep the tag.
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — nothing to release."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} does not exist — releasing."
          fi

      - name: Extract changelog section
        if: steps.tag.outputs.release_exists == 'false'
        run: |
          python3 .github/scripts/release_notes_body.py \
            "${{ steps.version.outputs.version }}" \
            "${{ github.server_url }}/${{ github.repository }}" \
            release-notes.md

      - name: Create annotated tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${{ steps.version.outputs.title }} ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: steps.tag.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "${TAG}" \
            --verify-tag \
            --title "${{ steps.version.outputs.title }} ${TAG}" \
            --notes-file release-notes.md
