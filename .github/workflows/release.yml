name: Release

# Per-plugin release for acs. The marketplace is NOT versioned or released:
# marketplace.json carries no "version", and the acs entry is a git-subdir
# source pinned to the moving branch `acs-stable`, which this workflow advances
# to each release tag. A consumer therefore updates the plugin alone
# (`claude plugin update acs@gms-marketplace`); nothing re-pins the marketplace.
# To ship a release:
#   1. Bump "version" in plugins/acs/.claude-plugin/plugin.json and in
#      plugins/acs/.devin-plugin/plugin.json and .devin-plugin/plugin.json to
#      the SAME value (CI enforces they match), following semver: MAJOR for
#      breaking changes to skills/hooks/state contracts, MINOR for new
#      backwards-compatible capability, PATCH for backwards-compatible fixes.
#   2. Set the acs entry's "ref" in .devin-plugin/plugin.json requiredPlugins
#      to "v<version>" (the tag is created by this same push). Leave
#      marketplace.json alone: its ref is the stable branch, never a version.
#   3. Add a matching "## [<version>] - YYYY-MM-DD" section to
#      plugins/acs/CHANGELOG.md (move entries out of [Unreleased]).
#   4. Merge to main. This workflow reads the plugin version, and if tag
#      v<version> does not exist yet, creates an annotated tag, creates a
#      GitHub release whose notes are that changelog section (capped below
#      GitHub's 125000-character body limit, linking the full CHANGELOG), and
#      fast-forwards (force-moves) branch `acs-stable` to the tagged commit. If
#      the tag and the release both exist, it skips gracefully; a tag with no
#      release (a previously failed publish) gets its release created. The
#      branch is always (re)pointed at the tag, so a failed run self-heals.
#      Seed or repair the branch with workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - plugins/acs/.claude-plugin/plugin.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so all existing tags are visible

      - name: Read version
        id: version
        run: |
          MANIFEST="plugins/acs/.claude-plugin/plugin.json"
          VERSION="$(python3 -c "import json; print(json.load(open('${MANIFEST}'))['version'])")"
          TITLE="$(python3 -c "import json; print(json.load(open('${MANIFEST}'))['name'])")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"
          echo "Release title: ${TITLE}"

      - name: Check whether tag and release already exist
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist."
          fi
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — nothing to publish."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} does not exist — publishing."
          fi

      - name: Extract changelog section
        if: steps.tag.outputs.release_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          with open("plugins/acs/CHANGELOG.md", encoding="utf-8") as fh:
              text = fh.read()
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.M | re.S)
          if not match:
              sys.exit(
                  f"No '## [{version}]' section found in plugins/acs/CHANGELOG.md — "
                  "add one before releasing (semver discipline: version bump + "
                  "changelog section ship together)."
              )
          # Drop Keep-a-Changelog link-reference definitions from the notes.
          lines = [
              line for line in match.group(1).splitlines()
              if not re.match(r"^\[[^\]]+\]:\s*\S", line)
          ]
          notes = "\n".join(lines).strip() + "\n"
          # GitHub rejects a release body over 125000 characters. Cut at a
          # line boundary and point at the full section instead.
          limit = 120000
          if len(notes) > limit:
              tail = (
                  f"\n\n---\n\n_Release notes truncated: the full "
                  f"[{version}] section is in "
                  f"[plugins/acs/CHANGELOG.md]"
                  f"(https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/blob/v{version}/plugins/acs/CHANGELOG.md)._\n"
              )
              cut = notes.rfind("\n", 0, limit - len(tail))
              notes = notes[:cut].rstrip() + tail
          with open("release-notes.md", "w", encoding="utf-8") as fh:
              fh.write(notes)
          print(f"Release notes for v{version}:\n{notes}")
          EOF

      - name: Create annotated tag
        if: steps.tag.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${{ steps.version.outputs.title }} ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: steps.tag.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "${TAG}" \
            --title "${{ steps.version.outputs.title }} ${TAG}" \
            --notes-file release-notes.md

      - name: Advance the acs-stable branch
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The marketplace's acs entry clones this branch (a branch, never a
          # bare SHA: `git clone --branch` rejects one). Point it at the tag.
          git push --force origin "refs/tags/${TAG}^{commit}:refs/heads/acs-stable"
