name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests & validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Every ref, so tests/acs/test_marketplace_ref_resolves.py can ask
          # whether the marketplace ref actually resolves. At the default
          # depth-1 the checkout carries neither tags nor branches, so that
          # check SKIPS on every value `ref` can hold -- a tag after a release
          # cut, the default branch between cuts. That is how #540 (path moved
          # to src/acs, ref left at tag v0.4.9, resolvable at neither) went
          # green here and broke every install.
          #
          # fetch-tags alone is not enough: a pull_request checkout is detached
          # at the merge ref, where `git rev-parse main` fails and only
          # `origin/main` resolves. Full history is 6.4 MiB over 70 commits.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install xmllint (libxml2-utils)
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if timeout 60 sudo apt-get update -qq && timeout 60 sudo apt-get install -y -qq libxml2-utils; then
              exit 0
            fi
            echo "apt-get attempt $attempt failed or timed out, retrying..." >&2
            sleep 5
          done
          echo "::error::apt-get failed after 3 attempts" >&2
          exit 1

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate all JSON files parse
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if python3 -m json.tool "$f" > /dev/null; then
              echo "ok   $f"
            else
              echo "::error file=$f::invalid JSON"
              status=1
            fi
          done < <(find .claude-plugin .devin-plugin plugins src -name '*.json' -not -path '*/__pycache__/*' -print0 | sort -z)
          exit "$status"

      - name: Validate marketplace/plugin version consistency
        run: |
          python3 - <<'EOF'
          import json
          import os
          import subprocess
          import sys

          with open(".claude-plugin/marketplace.json", encoding="utf-8") as fh:
              mkt = json.load(fh)

          plugin_root = (mkt.get("metadata") or {}).get("pluginRoot")
          errors = []
          warnings = []
          seen = {}


          def read_manifest(rel, ref):
              """The plugin.json an INSTALL of this entry would get, or None.

              `path` belongs to `ref`, not to this working tree. Resolving it
              here instead is what broke the marketplace twice: when the tree
              moved plugins/acs -> src/acs, this check demanded a working-tree
              src/acs, so `path` was edited to satisfy it -- and the install
              then asked for src/acs at tag v0.4.9, where it does not exist.
              A pinned entry is judged at its ref; only an unpinned one (which
              tracks the default branch) is judged against the tree.
              """
              target = os.path.join(rel, ".claude-plugin", "plugin.json")

              def from_tree():
                  if not os.path.exists(target):
                      return None, target
                  with open(target, encoding="utf-8") as fh:
                      return json.load(fh), target

              if not ref:
                  return from_tree()

              # A ref that does not exist yet is the release-cut window: the
              # cut rewrites ref to v{version} and commits, and only the push
              # to main creates that tag (release.yml). The commit under test
              # IS the one about to be tagged, so the tree is exactly what the
              # tag will capture -- judging it there is judging the fixpoint
              # the cut is in the middle of establishing. Refusing instead
              # would make every release PR unmergeable.
              #
              # This is not a hole for the 2026-09-16 break: that entry named
              # v0.4.9, which existed, so it is judged at the ref and caught.
              # ci.yml checks out at fetch-depth 0, so tags really are present
              # and "absent" means "not created yet" rather than "not fetched".
              exists = subprocess.run(["git", "rev-parse", "--verify", "--quiet",
                                       ref + "^{commit}"], capture_output=True, text=True)
              if exists.returncode != 0:
                  pj, where = from_tree()
                  print(f"note: ref '{ref}' does not exist yet (release cut in "
                        f"progress?); judging {rel} against the working tree, "
                        f"which is what tagging this commit will capture")
                  return pj, where

              at_ref = "%s:%s/.claude-plugin/plugin.json" % (ref, rel)
              proc = subprocess.run(["git", "cat-file", "-p", at_ref],
                                    capture_output=True, text=True)
              if proc.returncode != 0:
                  return None, at_ref
              return json.loads(proc.stdout), at_ref

          for i, entry in enumerate(mkt.get("plugins", [])):
              name = entry.get("name")
              if not name:
                  errors.append(f"plugins[{i}]: missing 'name'")
                  continue
              if name in seen:
                  errors.append(f"duplicate plugin name '{name}' (entries {seen[name]} and {i})")
              else:
                  seen[name] = i

              # Resolve a local plugin.json to cross-check for string-path sources and for
              # git-subdir object sources (which ship from this same repo). Other object
              # sources (github/url/npm) are fetched remotely and have no local manifest.
              src = entry.get("source")
              if isinstance(src, str):
                  rel = src
              elif isinstance(src, dict) and src.get("source") == "git-subdir":
                  rel = src["path"]
              else:
                  continue
              if plugin_root and not rel.startswith(("./", "/")):
                  rel = os.path.join(plugin_root, rel)

              ref = src.get("ref") if isinstance(src, dict) else None
              pj, manifest = read_manifest(rel, ref)
              if pj is None:
                  errors.append(f"'{name}': source '{src}' has no plugin.json at {manifest}")
                  continue

              pj_name = pj.get("name")
              if pj_name and pj_name != name:
                  errors.append(f"'{name}': marketplace entry name != plugin.json name '{pj_name}'")

              pj_version = pj.get("version")
              if not pj_version:
                  warnings.append(f"'{name}': plugin.json declares no 'version' (updates will track the commit SHA)")

              entry_version = entry.get("version")
              if entry_version is not None and pj_version is not None and entry_version != pj_version:
                  errors.append(
                      f"'{name}': marketplace entry version '{entry_version}' != plugin.json version "
                      f"'{pj_version}'. Remove the entry version or align them — plugin.json wins silently."
                  )

          # The Devin manifests are working-tree files, so they are judged
          # against the tree -- via plugin_dirs(), never via the entry's `path`.
          # `path` is ref-relative (read_manifest above reads the Claude
          # manifest AT the ref), so pairing the two switches this check off
          # silently: with the entry pinned at plugins/acs@v0.4.9 while the
          # tree holds src/acs, os.path.exists(rel + "/.devin-plugin") is False
          # for the one plugin there is, and a wrong version passes green.
          # Same trap, same remedy as .github/scripts/plugin_source_dirs.py.
          sys.path.insert(0, ".github/scripts")
          from plugin_source_dirs import plugin_dirs

          for plugin_dir in plugin_dirs():
              devin_manifest = os.path.join(plugin_dir, ".devin-plugin", "plugin.json")
              if not os.path.exists(devin_manifest):
                  continue
              with open(devin_manifest, encoding="utf-8") as fh:
                  dm = json.load(fh)
              # plugin_dirs() found this dir BY its .claude-plugin/plugin.json.
              with open(os.path.join(plugin_dir, ".claude-plugin", "plugin.json"),
                        encoding="utf-8") as fh:
                  cm = json.load(fh)

              dm_name, cm_name = dm.get("name"), cm.get("name")
              if dm_name and cm_name and dm_name != cm_name:
                  errors.append(
                      f"'{plugin_dir}': .devin-plugin/plugin.json name '{dm_name}' != "
                      f".claude-plugin/plugin.json name '{cm_name}'"
                  )
              dm_version, cm_version = dm.get("version"), cm.get("version")
              if dm_version is not None and cm_version is not None and dm_version != cm_version:
                  errors.append(
                      f"'{plugin_dir}': .devin-plugin/plugin.json version '{dm_version}' != "
                      f".claude-plugin/plugin.json version '{cm_version}' — the repo ships "
                      f"one shared version."
                  )

          # Root Devin meta-plugin shares the marketplace's version.
          root_devin = ".devin-plugin/plugin.json"
          if os.path.exists(root_devin):
              with open(root_devin, encoding="utf-8") as fh:
                  rm = json.load(fh)
              if rm.get("version") and mkt.get("version") and rm["version"] != mkt["version"]:
                  errors.append(
                      f".devin-plugin/plugin.json version '{rm['version']}' != marketplace.json version "
                      f"'{mkt['version']}' — the repo ships one shared version."
                  )

          for w in warnings:
              print(f"::warning::{w}")
          for e in errors:
              print(f"::error::{e}", file=sys.stderr)
          if errors:
              sys.exit(1)
          print(f"Marketplace/plugin version consistency OK ({len(seen)} plugin(s)).")
          EOF

      - name: Validate JSON Schema documents (structural)
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os
          import sys

          sys.path.insert(0, ".github/scripts")
          from plugin_source_dirs import plugin_dirs

          failed = False

          # The SOURCE dirs in this tree, not marketplace.json's `path` (which
          # is ref-relative -- see .github/scripts/plugin_source_dirs.py).
          for plugin_dir in plugin_dirs():

              paths = sorted(glob.glob(os.path.join(plugin_dir, "schemas", "*.schema.json")))
              if not paths:
                  print(f"skip: no *.schema.json found under {plugin_dir}/schemas/ (plugin has no schemas)")
                  continue
              for path in paths:
                  try:
                      with open(path, encoding="utf-8") as fh:
                          doc = json.load(fh)
                  except json.JSONDecodeError as exc:
                      print(f"FAIL {path}: not valid JSON: {exc}", file=sys.stderr)
                      failed = True
                      continue
                  if not isinstance(doc, dict):
                      print(f"FAIL {path}: top-level value is not an object", file=sys.stderr)
                      failed = True
                  elif "$schema" not in doc:
                      print(f'FAIL {path}: missing top-level "$schema" key', file=sys.stderr)
                      failed = True
                  else:
                      print(f"ok   {path}")
          sys.exit(1 if failed else 0)
          EOF

      - name: Validate committed per-plugin settings.json against the schema
        run: |
          python3 -m pip install --quiet jsonschema
          python3 - <<'EOF'
          import glob
          import json
          import os
          import sys
          from jsonschema import Draft202012Validator

          sys.path.insert(0, ".github/scripts")
          from plugin_source_dirs import plugin_dirs

          for plugin_dir in plugin_dirs():

              schema_path = os.path.join(plugin_dir, "schemas", "settings.schema.json")
              if not os.path.exists(schema_path):
                  print(f"skip: no settings.schema.json found under {plugin_dir}/schemas/")
                  continue

              schema = json.load(open(schema_path, encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              validator = Draft202012Validator(schema)

              plugin_name = os.path.basename(plugin_dir)
              target = os.path.join("." + plugin_name, "settings.json")
              if not os.path.exists(target):
                  print(f"skip: no {target}")
                  continue

              errors = sorted(
                  validator.iter_errors(json.load(open(target, encoding="utf-8"))),
                  key=lambda e: list(e.path),
              )
              for e in errors:
                  loc = "/".join(map(str, e.path)) or "(root)"
                  print(f"::error file={target}::{loc}: {e.message}", file=sys.stderr)
              if errors:
                  sys.exit(1)
              print(f"ok   {target} conforms to {schema_path}")
          EOF

      - name: Validate XSD (acs-messages.xsd)
        run: |
          status=0
          while IFS= read -r plugin_dir; do
            [ -z "$plugin_dir" ] && continue
            xsd_files=()
            while IFS= read -r -d '' f; do
              xsd_files+=("$f")
            done < <(find "$plugin_dir/schemas" -maxdepth 1 -name '*.xsd' -print0 2>/dev/null | sort -z)
            if [ ${#xsd_files[@]} -eq 0 ]; then
              echo "skip: no *.xsd found under $plugin_dir/schemas/ (plugin has no XSD)"
              continue
            fi
            for xsd_file in "${xsd_files[@]}"; do
              xmllint --noout "$xsd_file"
              echo "ok   $xsd_file"
            done
          done < <(python3 .github/scripts/plugin_source_dirs.py)
          exit "$status"

      - name: Byte-compile hook scripts
        run: |
          status=0
          while IFS= read -r plugin_dir; do
            [ -z "$plugin_dir" ] && continue
            py_files=()
            # Recursive on purpose: acs_lib is a package (MAR-522), so -maxdepth 1
            # would silently stop compiling the whole deterministic kernel while
            # this step still printed "ok".
            while IFS= read -r -d '' f; do
              py_files+=("$f")
            done < <(find "$plugin_dir/hooks/scripts" -name '*.py' -not -path '*/__pycache__/*' -print0 2>/dev/null | sort -z)
            if [ ${#py_files[@]} -eq 0 ]; then
              echo "skip: no *.py found under $plugin_dir/hooks/scripts/ (plugin has no hook scripts)"
              continue
            fi
            if ! python3 -m py_compile "${py_files[@]}"; then
              status=1
            else
              echo "ok   compiled ${#py_files[@]} hook script(s) in $plugin_dir"
            fi
          done < <(python3 .github/scripts/plugin_source_dirs.py)
          exit "$status"

      - name: Check skill/agent frontmatter (name + description)
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os
          import re
          import sys

          sys.path.insert(0, ".github/scripts")
          from plugin_source_dirs import plugin_dirs

          failed = False

          # The SOURCE dirs in this tree, not marketplace.json's `path` (which
          # is ref-relative -- see .github/scripts/plugin_source_dirs.py).
          for plugin_dir in plugin_dirs():

              paths = sorted(glob.glob(os.path.join(plugin_dir, "skills", "*", "SKILL.md"))) \
                    + sorted(glob.glob(os.path.join(plugin_dir, "agents", "*.md")))
              if not paths:
                  print(f"skip: no SKILL.md or agent .md files found under {plugin_dir} (plugin has no skills/agents)")
                  continue
              for path in paths:
                  with open(path, encoding="utf-8") as fh:
                      text = fh.read()
                  match = re.match(r"\A---\r?\n(.*?)\r?\n---\r?\n", text, re.S)
                  if not match:
                      print(f"FAIL {path}: missing YAML frontmatter block", file=sys.stderr)
                      failed = True
                      continue
                  frontmatter = match.group(1)
                  missing = [
                      key for key in ("name", "description")
                      if not re.search(rf"^{key}:\s*\S", frontmatter, re.M)
                  ]
                  if missing:
                      print(f"FAIL {path}: frontmatter missing {', '.join(missing)}", file=sys.stderr)
                      failed = True
                  else:
                      print(f"ok   {path}")
          sys.exit(1 if failed else 0)
          EOF
