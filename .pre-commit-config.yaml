# Pre-commit hooks for autonomous-coding-skills
# Install once per clone:  pre-commit install
# Run on all files:        pre-commit run --all-files
repos:
  # Secret scanning — blocks commits containing credentials/keys/tokens
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # General hygiene / footguns
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key          # catches PEM/SSH private keys
      - id: check-added-large-files      # blocks accidental large blobs
        args: ["--maxkb=5000"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict         # blocks unresolved conflict markers
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending

  # Mermaid diagram lint — deterministic ($0, no Node) check that fenced
  # ```mermaid blocks won't render as a GitHub error box. Catches the known
  # breakers: semicolons in sequenceDiagram, space-separated erDiagram keys,
  # unknown diagram types. Also enforced in CI via the unittest suite.
  - repo: local
    hooks:
      - id: mermaid-lint
        name: mermaid diagram lint
        entry: python3 plugins/acs/hooks/scripts/mermaid_lint.py
        language: system
        files: \.md$


      # Eval-suite checks ($0, a few seconds): case shape and coverage, grader
      # calibration against the plugin's real writers, and the release gate's
      # judgement. Local only — CI's pre-commit job SKIPs this hook, and CI's
      # test discovery never loads tests/evals/ (ADR-0108). Fires when a commit
      # touches the suite, a skill, the hook scripts the calibration plays
      # through, or the gate.
      - id: acs-eval-checks
        name: acs eval-suite checks (local only)
        entry: python3 -m unittest discover -s tests/evals -p check_*.py
        language: system
        pass_filenames: false
        files: ^(plugins/acs/(evals|skills|hooks/scripts|schemas)/|tests/evals/|scripts/eval_(gate|changed)\.py$|\.acs/settings\.json$)

      # PAID, opt-in: the evals this branch's change can move, one run each, on
      # `git push` (or `pre-commit run acs-evals --hook-stage manual`). Off
      # until `git config acs.evals true`; needs the pre-push hook type
      # installed (`pre-commit install --hook-type pre-push`). Never in CI:
      # the pre-push and manual stages are not run by CI's pre-commit job, and
      # the script refuses when CI is set (ADR-0108). See
      # plugins/acs/evals/README.md, "Running the evals your change affects".
      - id: acs-evals
        name: acs evals for this change (local, opt-in, paid)
        entry: python3 scripts/eval_changed.py
        language: system
        stages: [pre-push, manual]
        pass_filenames: false
        always_run: true
        verbose: true

      # acs convention hooks — validate branch/commit against committed formats.*
      # (honour enforcement.checks.* toggles + exempt label/branches).
      - id: acs-commit-msg
        name: acs commit message convention
        entry: python3 .acs/ci/check-conventions.py --mode commit-msg --message-file
        language: system
        stages: [commit-msg]
        pass_filenames: true       # pre-commit appends the message-file path
        always_run: true
      - id: acs-pre-push
        name: acs branch + commit conventions
        entry: python3 .acs/ci/check-conventions.py --mode pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
