# workflows/phases.yaml — the skill registry, grouped by phase.
#
# Rules (asserted by tests/acs/test_phases_registry.py):
#   * every src/acs/skills/<dir> appears exactly once — in a phase list, as
#     a key under `aliases` (a directory that forwards to a skill), or as a key
#     under `internal` (a leg that only its entry point invokes);
#   * only these five groups exist;
#   * workflows/ship.yaml may name build, test and ship skills only, and never
#     merge-pr or release (a human always drives those).
# This file is the single source for the ship-workflow schema's skill enum, the
# README skill table (grouped by phase), INTERNALS.md and /acs:metrics grouping.
version: 1
phases:
  design:
    - create-prd
    - create-requirements
    - create-architecture
    - create-docs
    - project
    - create-ticket
    - create-design
  build:
    - analyze-ticket
    - create-api-contract
    - create-impl-plan
    - create-test-docs
    - code
    - docs-sync
  test:
    - create-e2e-tests
    - run-e2e-tests
  ship:
    - create-pr
    - merge-pr
    - release
  utility:
    - setup
    - install-hooks
    - update
    - handoff
    - metrics
    - usage
    - ship
# Alias directories: `test` forwards to run-e2e-tests for one release.
aliases:
  test: run-e2e-tests
# Internal legs: each keeps its SKILL.md, agents, hooks, gate and sentinels and
# stays Skill-invocable, but the entry point named here is the only user-facing
# command for it — an entry-point fold, not a collapse. (The four doc legs
# create-docs used to fan out were collapsed INTO it — ADR-0094 — so it is a
# skill of its own now, not an entry point over legs.)
# `code`'s four legs are the delivery paths of ADR-0095: /acs:ship names one in
# its ship.yaml per-path `skill` mapping, and /acs:code dispatches to the same
# one when invoked directly. They are legs, not commands, because which one a
# ticket gets is decided from its plan — never chosen by hand.
internal:
  create-project: project
  standardize-project: project
  code-trivial: code
  code-small: code
  code-standard: code
  code-complex: code
# Subagent roles each skill owns, per ADR-0092. A skill declares the machinery
# its work needs; nothing is inferred from whether it is hooked. Omit a skill
# and it owns no subagents at all (classes A and B: mechanical actions and
# dispatchers).
#   * apply-with-a-gate (create-pr, create-ticket, merge-pr) keeps an executor
#     and no planner or verifier: its judgement is a readiness gate that runs
#     BEFORE the action, not a review after it;
#   * authoring skills have no planner — when the deliverable IS the plan
#     or the analysis, a planning phase to plan it is a second copy of the
#     work. Their executor surveys first (iteration 1, recorded in its
#     authoring notes) and authors from the survey; their verifier judges the
#     deliverable against those notes (create-docs was the first, with
#     ADR-0094; the other twelve followed in ADR-0092's stage 2);
#   * code keeps an executor and a verifier; its plan phase is its own skill.
#     Its four delivery-path legs (ADR-0095) declare NO agents of their own and
#     spawn `acs:code-executor` / `acs:code-verifier` -- the same two files.
#     What differs between the paths is how MANY of each run and how deep the
#     verifier looks, which is each leg's SKILL.md to say. Giving a leg its own
#     agents entry would demand four near-identical copies of two charters,
#     which is the duplication ADR-0094 removed from the doc sets.
agents:
  analyze-ticket: [executor, verifier]
  code: [executor, verifier]
  create-api-contract: [executor, verifier]
  create-architecture: [executor, verifier]
  create-design: [executor, verifier]
  create-docs: [executor, verifier]
  create-e2e-tests: [executor, verifier]
  create-impl-plan: [executor, verifier]
  create-pr: [executor]
  create-prd: [executor, verifier]
  create-project: [executor, verifier]
  create-requirements: [executor, verifier]
  create-test-docs: [executor, verifier]
  create-ticket: [executor]
  docs-sync: [executor, verifier]
  merge-pr: [executor]
  standardize-project: [executor, verifier]
