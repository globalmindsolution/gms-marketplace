# workflows/ship.yaml — the delivery pipeline /acs:ship drives.
#
# A LIST, and deliberately nothing more. No `when:`, `paths:`, `requires:`,
# `needs:`, `id:`, `name:`, `stop_after:`, `max_parallel`, `exclusive:`,
# `on_fail:`, `boundary:` or `delivery:` — the schema rejects every one of
# them. The declared order IS the dependency order and every step runs on
# every run; a step with nothing owed records an evidenced no-op from its own
# pre-hook, at no token cost, rather than being skipped by a predicate here.
#
# That follows from the standalone-skill rule: a skill whose applicability is
# decided by a workflow predicate cannot be run on its own and be trusted,
# because invoked by hand it never evaluates the condition the workflow was
# evaluating for it. Each skill decides for itself and records why.
#
# An entry may be a LIST of skill names -- a PARALLEL GROUP. /acs:ship starts
# its members together and the next entry waits for all of them. A group is
# not a condition either: it declares that its members may overlap, nothing
# about whether they have work. create-e2e-tests and docs-sync both follow the
# reviewed changeset and write disjoint files (suites vs docs), so they run
# side by side; run-e2e-tests then runs the suites the first one wrote.
#
# `loops:` is the only other construct, and it is not a condition — it tests nothing
# about the change, it declares that two steps form a cycle and how many
# times. It cannot live inside a skill because it spans two of them.
#
# The list is an ORCHESTRATOR and nothing more: it keeps the order the skills
# run in. Each skill is independent -- it reads what it finds and falls back
# to the run's subject when an upstream artifact is absent -- so no skill is
# refused for running before another, and `acs workflow validate` checks only
# that every step is a skill that ships (and not another skill's leg) and that
# every loop goes back.
#
# The Design skills -- create-architecture, create-api-contract (ADR-0134),
# create-data-design, create-flows, create-design -- are no steps here: they
# run before or without a plan, and the planner reads what they wrote.
#
# See plugins/acs/docs/REDESIGN-IMPLEMENTATION-PIPELINE.md §2.
version: 3

steps:
  - analyze-requirements
  - create-impl-plan
  - create-test-docs
  - code
  - review-code
  - [create-e2e-tests, docs-sync]   # a parallel group: both start together
  - run-e2e-tests
  - create-pr

loops:
  - from: review-code
    back_to: code             # on blocking findings, re-enter at `code`
    max_iterations: 3         # counts code->review-code rounds
    on_exhausted: fail        # never "pass with findings"
