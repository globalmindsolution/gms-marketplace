# workflows/phases.yaml — the skill registry, grouped by phase.
#
# Rules (asserted by tests/acs/test_phases_registry.py):
#   * every plugins/acs/skills/<dir> appears exactly once — in a phase list, as
#     a key under `aliases` (a directory that forwards to a skill), or as a key
#     under `internal` (a leg that only its entry point invokes);
#   * only these five groups exist;
#   * workflows/ship.yaml may name build, test and ship skills only, and never
#     merge-pr or release (a human always drives those).
# This file is the single source for the ship-workflow schema's skill enum, the
# README skill table (grouped by phase), INTERNALS.md and /acs:metrics grouping.
version: 1
phases:
  design:
    - create-prd
    - create-requirements
    - create-architecture
    - create-docs
    - project
    - create-ticket
    - create-design
  build:
    - analyze-ticket
    - create-api-contract
    - create-impl-plan
    - create-test-docs
    - code
    - docs-sync
  test:
    - create-e2e-tests
    - run-e2e-tests
  ship:
    - create-pr
    - merge-pr
    - release
  utility:
    - setup
    - install-hooks
    - update
    - handoff
    - metrics
    - usage
    - ship
# Alias directories: `test` forwards to run-e2e-tests for one release.
aliases:
  test: run-e2e-tests
# Internal legs: each keeps its SKILL.md, agents, hooks, gate and sentinels and
# stays Skill-invocable, but the entry point named here is the only user-facing
# command for it — an entry-point fold, not a collapse.
internal:
  create-quality: create-docs
  create-operations: create-docs
  create-principles: create-docs
  create-standards: create-docs
  create-project: project
  standardize-project: project
# Subagent roles each skill owns, per ADR-0092. A skill declares the machinery
# its work needs; nothing is inferred from whether it is hooked. Omit a skill
# and it owns no subagents at all (classes A and B: mechanical actions and
# dispatchers).
#   * apply-with-a-gate (create-pr, create-ticket, merge-pr) keeps an executor
#     and no planner or verifier: its judgement is a readiness gate that runs
#     BEFORE the action, not a review after it;
#   * authoring skills lose their planner — when the deliverable IS the plan
#     or the analysis, a planning phase to plan it is a second copy of the
#     work. They still declare one below: that removal changes behaviour, so
#     it lands one skill at a time, each editing its own line here, and the
#     line is the record of which skills have been through it;
#   * code keeps an executor and a verifier; its plan phase is its own skill.
agents:
  analyze-ticket: [planner, executor, verifier]
  code: [executor, verifier]
  create-api-contract: [planner, executor, verifier]
  create-architecture: [planner, executor, verifier]
  create-design: [planner, executor, verifier]
  create-e2e-tests: [planner, executor, verifier]
  create-impl-plan: [planner, executor, verifier]
  create-operations: [planner, executor, verifier]
  create-pr: [executor]
  create-prd: [planner, executor, verifier]
  create-principles: [planner, executor, verifier]
  create-project: [planner, executor, verifier]
  create-quality: [planner, executor, verifier]
  create-requirements: [planner, executor, verifier]
  create-standards: [planner, executor, verifier]
  create-test-docs: [planner, executor, verifier]
  create-ticket: [executor]
  docs-sync: [planner, executor, verifier]
  merge-pr: [executor]
  standardize-project: [planner, executor, verifier]
